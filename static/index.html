<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParcelPilot Support Agent</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><header><div><p class="eyebrow">PARCELPILOT · TRUSTED SUPPORT</p><h1>Support Agent</h1><p>Grounded answers, scoped data access, and confirmation-first actions.</p></div>
<select id="principal"></select></header>
